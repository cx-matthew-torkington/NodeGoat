{% extends "./layout.html" %} {% block title %}Status{% endblock %} {% block content %}

<div class="row">
    <div class="col-lg-12">

        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">
                    Service Status
                </h3>
            </div>

            <div class="panel-body">
                <table class="table">
                    <tbody>
                        <tr>
                            <th>Application</th>
                            <td>{{status.appName}} v{{status.version}}</td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td>{{status.status}}</td>
                        </tr>
                        <tr>
                            <th>Database</th>
                            <td>{{status.database}}</td>
                        </tr>
                        <tr>
                            <th>Uptime (seconds)</th>
                            <td>{{status.uptimeSeconds}}</td>
                        </tr>
                        <tr>
                            <th>Checked at</th>
                            <td>{{status.timestamp}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
{% endblock %}
